name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore tests/WebQLBH.Tests/WebQLBH.Tests.csproj

    - name: Build solution
      run: dotnet build tests/WebQLBH.Tests/WebQLBH.Tests.csproj --configuration Release --no-restore

    - name: Run automated tests
      run: dotnet test tests/WebQLBH.Tests/WebQLBH.Tests.csproj --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed"
